<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1 id="hello">Witaj na mojej stronie!</h1>

    <button id="send">Wyślij</button>
    <hr>

    <form>
        <label for="price">Cena</label>
        <input type="number" id="price" name="price"><br>
        
        <label for="amount">Ilość</label>
        <input type="number" id="amount" name="amount"><br>
        <button id="calculate" onclick="oblicz()">Oblicz</button>

        <p id="result"></p>
    </form>
    <hr>

    <form>
        <label for="length">Długość</label>
        <input type="number" id="length" name="length"><br>
        
        <label for="width">Szerokość</label>
        <input type="number" id="width" name="width"><br>

        <label for="plytka">Płytka</label>
        <input type="number" id="plytka" name="plytka"><br>
        <button id="calculate" onclick="oblicz2()" type="button">Oblicz</button>

        <p id="result2"></p>
    </form>
    <hr>
    <script>
        let button = document.getElementById("send")
        button.addEventListener("click",function(){
            let h1 = document.getElementById("hello")
            h1.textContent="Udało Ci się!"
        })

        function oblicz(){
            let p = document.getElementById("result")
            let price = document.getElementById("price").value
            let amount = document.getElementById("amount").value
            p.textContent="Cena to: "+price*amount+"zł"
        }

        function oblicz2(){
            let p = document.getElementById("result2")
            let length = document.getElementById("length").value
            let width = document.getElementById("width").value
            let plytka = document.getElementById("plytka").value
            let result = (length*width)/plytka
            p.textContent="Iłość płytek: "+result
        }

    </script>
</body>
</html>
